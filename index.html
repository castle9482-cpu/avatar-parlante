<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120b24"><title>Genio Parlante</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#55307d,#160d25 58%,#08050e);color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.app{text-align:center;width:min(560px,100%)}h1{margin:0 0 4px;font-size:28px}.sub{opacity:.65;margin-bottom:18px}.face{width:290px;height:290px;margin:0 auto 22px;border-radius:50%;background:linear-gradient(145deg,#ffc982,#b85d32);border:8px solid #e8ad4f;box-shadow:0 0 45px #e8ad4f66;position:relative;transition:.25s}.face.listening{box-shadow:0 0 80px #62e6ff,0 0 30px #fff;transform:scale(1.02)}.face.speaking{animation:breathe .45s infinite alternate}.eyes{position:absolute;top:90px;left:54px;right:54px;display:flex;justify-content:space-between}.eye{width:48px;height:62px;background:#fff;border-radius:50%;position:relative}.pupil{width:19px;height:27px;background:#17101f;border-radius:50%;position:absolute;left:15px;top:19px}.brow{position:absolute;top:70px;width:60px;height:12px;border-top:6px solid #673521;border-radius:50%}.b1{left:48px;transform:rotate(-8deg)}.b2{right:48px;transform:rotate(8deg)}.mouth{position:absolute;left:86px;top:169px;width:110px;height:34px;border-bottom:8px solid #381b21;border-radius:0 0 65px 65px;transition:.12s}.speaking .mouth{height:52px;border:7px solid #381b21;border-radius:50%}.ear{position:absolute;top:110px;width:32px;height:70px;background:#c36b3b;border-radius:50%}.e1{left:-25px}.e2{right:-25px}.status{min-height:28px;font-weight:600;margin-bottom:10px}.text{min-height:58px;background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;margin-bottom:15px;line-height:1.4}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;background:#e8ad4f;color:#211424;font-size:15px}button.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff2d}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;opacity:.58;margin-top:15px;line-height:1.4}@keyframes breathe{to{transform:translateY(-2px)}}</style></head>
<body><main class="app"><h1>✨ Genio Parlante</h1><div class="sub">Habla conmigo por voz</div><div id="face" class="face"><div class="ear e1"></div><div class="ear e2"></div><div class="brow b1"></div><div class="brow b2"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div><div id="status" class="status">Pulsa «Escuchar» y habla.</div><div id="text" class="text">Estoy preparado. Ahora la conversación se procesa en un servidor seguro.</div><div class="controls"><button id="listen">🎙️ Escuchar</button><button id="stop" class="secondary" disabled>⏹ Parar</button></div><div class="hint">El micrófono se usa solo para convertir tu voz en texto. La clave de IA permanece en el servidor.</div></main>
<script>
const face=document.getElementById('face'),status=document.getElementById('status'),text=document.getElementById('text'),listen=document.getElementById('listen'),stop=document.getElementById('stop');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null,speaking=false,history=[];
function speak(message){if(!('speechSynthesis'in window)){status.textContent='No hay síntesis de voz disponible.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='es-ES';u.rate=.94;u.pitch=1.08;u.onstart=()=>{speaking=true;face.classList.add('speaking');status.textContent='🔊 Hablando…'};u.onend=()=>{speaking=false;face.classList.remove('speaking');status.textContent='Pulsa «Escuchar» para hablar de nuevo.'};speechSynthesis.speak(u)}
async function respond(message){text.textContent=message;status.textContent='🧠 Pensando…';listen.disabled=true;history.push({role:'user',content:message});if(history.length>12)history=history.slice(-12);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error del servidor');const answer=data.text||'No he recibido respuesta.';history.push({role:'assistant',content:answer});text.textContent=answer;speak(answer)}catch(e){status.textContent='⚠️ No puedo conectar con la IA.';text.textContent='El servidor de IA todavía no está conectado. La clave permanece protegida y no debes introducirla en esta página.';console.error(e)}finally{if(!speaking)listen.disabled=false}}
if(!SR){status.textContent='Este navegador no permite reconocimiento de voz.';listen.disabled=true}else{recognition=new SR();recognition.lang='es-ES';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onstart=()=>{face.classList.add('listening');status.textContent='🎙️ Te estoy escuchando…';listen.disabled=true;stop.disabled=false};recognition.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else text.textContent='Escuchando: '+t}if(final)respond(final.trim())};recognition.onerror=e=>{face.classList.remove('listening');listen.disabled=false;stop.disabled=true;status.textContent=e.error==='not-allowed'?'⚠️ Permite el acceso al micrófono.':'Error de voz: '+e.error};recognition.onend=()=>{face.classList.remove('listening');stop.disabled=true;if(!speaking&&!status.textContent.startsWith('⚠️')&&!status.textContent.includes('Pensando')){listen.disabled=false;status.textContent='Pulsa «Escuchar» para hablar de nuevo.'}};listen.onclick=()=>{try{recognition.start()}catch(e){}};stop.onclick=()=>recognition.stop()}
</script></body></html>
