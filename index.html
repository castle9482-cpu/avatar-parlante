<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Genio Parlante</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#55307d,#10091b);color:white;font-family:system-ui;text-align:center;padding:18px}.app{max-width:580px;margin:auto}.face{width:290px;height:290px;margin:20px auto;border-radius:50%;background:linear-gradient(145deg,#ffc982,#b85d32);border:8px solid #e8ad4f;position:relative;box-shadow:0 0 45px #e8ad4f66}.face.listening{box-shadow:0 0 80px #62e6ff}.face.thinking{box-shadow:0 0 70px #a66cff}.face.speaking .mouth{height:52px;border:7px solid #381b21;border-radius:50%}.eyes{position:absolute;top:90px;left:54px;right:54px;display:flex;justify-content:space-between}.eye{width:48px;height:62px;background:white;border-radius:50%;position:relative}.pupil{width:19px;height:27px;background:#17101f;border-radius:50%;position:absolute;left:15px;top:19px}.mouth{position:absolute;left:86px;top:169px;width:110px;height:34px;border-bottom:8px solid #381b21;border-radius:0 0 65px 65px}.brow{position:absolute;top:70px;width:60px;border-top:6px solid #673521;border-radius:50%}.b1{left:48px;transform:rotate(-8deg)}.b2{right:48px;transform:rotate(8deg)}button{border:0;border-radius:999px;padding:13px 20px;margin:5px;font-weight:800;cursor:pointer;background:#e8ad4f;color:#211424}.secondary{background:#ffffff20;color:white}.text{min-height:55px;padding:14px;background:#ffffff12;border-radius:16px}.status{min-height:28px;font-weight:bold}</style></head>
<body><main class="app"><h1>✨ Genio Parlante</h1><div>Habla conmigo por voz</div><div id="face" class="face"><div class="brow b1"></div><div class="brow b2"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div><div id="status" class="status">Pulsa «Escuchar» y habla.</div><div id="text" class="text">Estoy preparado para conversar.</div><button id="listen">🎙️ Escuchar</button><button id="stop" class="secondary" disabled>⏹ Parar</button></main>
<script>
const API='https://avatar-parlante.vercel.app/api/chat';const face=document.getElementById('face'),status=document.getElementById('status'),text=document.getElementById('text'),listen=document.getElementById('listen'),stop=document.getElementById('stop');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,speaking=false,history=[];
function speak(s){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.88;u.pitch=.72;u.onstart=()=>{speaking=true;face.classList.add('speaking');status.textContent='🔊 Hablando…'};u.onend=()=>{speaking=false;face.classList.remove('speaking');status.textContent='Pulsa «Escuchar» para hablar de nuevo.';listen.disabled=false};speechSynthesis.speak(u)}
async function ask(msg){status.textContent='🧠 Pensando…';face.classList.remove('listening');face.classList.add('thinking');listen.disabled=true;history.push({role:'user',content:msg});if(history.length>12)history=history.slice(-12);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error del servidor');const a=d.text||'No he recibido respuesta.';history.push({role:'assistant',content:a});text.textContent=a;speak(a)}catch(e){face.classList.remove('thinking');status.textContent='⚠️ No puedo conectar con la IA.';text.textContent='No consigo contactar con mi magia ahora mismo. Inténtalo de nuevo.';listen.disabled=false}}
if(!SR){status.textContent='Tu navegador no permite reconocimiento de voz.';listen.disabled=true}else{rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>{face.classList.remove('thinking');face.classList.add('listening');status.textContent='🎙️ Te escucho…';listen.disabled=true;stop.disabled=false};rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)s+=e.results[i][0].transcript;else text.textContent='Escuchando: '+e.results[i][0].transcript}if(s)ask(s.trim())};rec.onerror=e=>{face.classList.remove('listening');listen.disabled=false;stop.disabled=true;status.textContent='⚠️ '+e.error};rec.onend=()=>{face.classList.remove('listening');stop.disabled=true;if(!speaking&&!status.textContent.includes('Pensando'))listen.disabled=false};listen.onclick=()=>{try{rec.start()}catch(e){}};stop.onclick=()=>rec.stop()}
</script></body></html>
