<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10051f"><title>Genio Parlante</title>
<!-- Vercel API routing fix trigger -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#70419b 0,#26113d 42%,#08030f 78%);color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}.app{text-align:center;width:min(600px,100%);position:relative}h1{margin:0 0 3px;font-size:30px;text-shadow:0 0 18px #d9a4ff88}.sub{opacity:.7;margin-bottom:20px}.magic{position:absolute;left:50%;top:305px;width:360px;height:100px;transform:translateX(-50%);pointer-events:none}.magic i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd66e;box-shadow:0 0 12px #ffe7a1;animation:float 2.8s infinite ease-in-out}.magic i:nth-child(1){left:8%;top:50%;animation-delay:-.2s}.magic i:nth-child(2){left:22%;top:20%;animation-delay:-1.2s}.magic i:nth-child(3){left:78%;top:30%;animation-delay:-.8s}.magic i:nth-child(4){left:92%;top:65%;animation-delay:-1.8s}.magic i:nth-child(5){left:50%;top:5%;animation-delay:-2.1s}.face{width:300px;height:300px;margin:0 auto 26px;border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 38% 28%,#ffdca2,#d8793d 58%,#93421f);border:8px solid #edbb58;box-shadow:0 0 42px #e8ad4f66,0 10px 35px #0008;position:relative;transition:.25s;z-index:2}.face:before{content:"";position:absolute;left:50%;top:-52px;width:150px;height:75px;transform:translateX(-50%);border-radius:50% 50% 45% 45%;background:linear-gradient(#7b442c,#321725);box-shadow:0 -10px 18px #0005}.face:after{content:"";position:absolute;left:50%;bottom:-28px;width:120px;height:45px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(transparent,#d98b48);filter:blur(7px);opacity:.6}.face.listening{box-shadow:0 0 90px #62e6ff,0 0 30px #fff,0 10px 35px #0008;transform:scale(1.025)}.face.thinking{box-shadow:0 0 70px #a66cff,0 10px 35px #0008}.face.speaking{animation:breathe .45s infinite alternate;box-shadow:0 0 65px #e8ad4f,0 0 25px #ffcf72}.eyes{position:absolute;top:91px;left:53px;right:53px;display:flex;justify-content:space-between}.eye{width:55px;height:67px;background:#fffaf0;border-radius:50%;position:relative;overflow:hidden;transition:.18s}.pupil{width:21px;height:29px;background:#17101f;border-radius:50%;position:absolute;left:17px;top:20px;transition:.15s}.eye.closed{height:8px;margin-top:30px;border-radius:50%;background:#673521}.eye.closed .pupil{display:none}.brow{position:absolute;top:67px;width:65px;height:15px;border-top:7px solid #673521;border-radius:50%;transition:.2s}.b1{left:47px;transform:rotate(-8deg)}.b2{right:47px;transform:rotate(8deg)}.thinking .b1{transform:rotate(10deg) translateY(-5px)}.thinking .b2{transform:rotate(-4deg)}.mouth{position:absolute;left:85px;top:172px;width:120px;height:34px;border-bottom:8px solid #381b21;border-radius:0 0 70px 70px;transition:.1s}.speaking .mouth{height:54px;border:7px solid #381b21;border-radius:50%;background:#702333}.ear{position:absolute;top:112px;width:34px;height:74px;background:#c36b3b;border-radius:50%;z-index:-1}.e1{left:-28px}.e2{right:-28px}.status{min-height:28px;font-weight:700;margin-bottom:10px}.text{min-height:62px;background:#ffffff0d;border:1px solid #ffffff24;border-radius:18px;padding:14px 16px;margin-bottom:16px;line-height:1.45;backdrop-filter:blur(8px)}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:13px 22px;font-weight:800;cursor:pointer;background:#e8ad4f;color:#211424;font-size:15px;box-shadow:0 5px 18px #0004}button.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff2d}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;opacity:.55;margin-top:15px;line-height:1.4}@keyframes breathe{to{transform:translateY(-3px)}}@keyframes float{0%,100%{transform:translateY(12px) scale(.7);opacity:.2}50%{transform:translateY(-18px) scale(1.3);opacity:1}}
</style></head>
<body><main class="app"><h1>✨ Genio Parlante</h1><div class="sub">Habla conmigo por voz</div><div id="magic" class="magic"><i></i><i></i><i></i><i></i><i></i></div><div id="face" class="face"><div class="ear e1"></div><div class="ear e2"></div><div class="brow b1"></div><div class="brow b2"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div><div id="status" class="status">Pulsa «Escuchar» y habla.</div><div id="text" class="text">Estoy preparado. Dime algo y te responderé con mi voz de genio.</div><div class="controls"><button id="listen">🎙️ Escuchar</button><button id="stop" class="secondary" disabled>⏹ Parar</button></div><div class="hint">El micrófono se usa para convertir tu voz en texto. La clave de IA permanece en el servidor.</div></main>
<script>
const face=document.getElementById('face'),status=document.getElementById('status'),text=document.getElementById('text'),listen=document.getElementById('listen'),stop=document.getElementById('stop');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null,speaking=false,history=[];let blinkTimer;
function blink(){const eyes=document.querySelectorAll('.eye');eyes.forEach(e=>e.classList.add('closed'));setTimeout(()=>eyes.forEach(e=>e.classList.remove('closed')),130);blinkTimer=setTimeout(blink,3000+Math.random()*4200)}blinkTimer=setTimeout(blink,2200);
function chooseVoice(){const voices=speechSynthesis.getVoices();const preferred=voices.filter(v=>/^es(-|_)/i.test(v.lang));return preferred.find(v=>/male|masculino|Jorge|Pablo|Diego|Álvaro|Alvaro|Google español/i.test(v.name))||preferred.find(v=>/Google|Microsoft/i.test(v.name))||preferred[0]||voices[0]}
function speak(message){if(!('speechSynthesis'in window)){status.textContent='No hay síntesis de voz disponible.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='es-ES';u.rate=.88;u.pitch=.72;const v=chooseVoice();if(v)u.voice=v;u.onstart=()=>{speaking=true;face.classList.remove('thinking','listening');face.classList.add('speaking');status.textContent='🔊 Hablando…'};u.onend=()=>{speaking=false;face.classList.remove('speaking');status.textContent='Pulsa «Escuchar» para hablar de nuevo.';listen.disabled=false};speechSynthesis.speak(u)}
async function respond(message){text.textContent=message;status.textContent='🧠 Pensando…';face.classList.remove('listening');face.classList.add('thinking');listen.disabled=true;history.push({role:'user',content:message});if(history.length>12)history=history.slice(-12);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error del servidor');const answer=data.text||'No he recibido respuesta.';history.push({role:'assistant',content:answer});text.textContent=answer;speak(answer)}catch(e){face.classList.remove('thinking');status.textContent='⚠️ No puedo conectar con la IA.';text.textContent='No consigo contactar con mi magia ahora mismo. Inténtalo de nuevo.';console.error(e);listen.disabled=false}}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
if(!SR){status.textContent='Este navegador no permite reconocimiento de voz.';listen.disabled=true}else{recognition=new SR();recognition.lang='es-ES';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onstart=()=>{face.classList.remove('thinking');face.classList.add('listening');status.textContent='🎙️ Te estoy escuchando…';listen.disabled=true;stop.disabled=false};recognition.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else text.textContent='Escuchando: '+t}if(final)respond(final.trim())};recognition.onerror=e=>{face.classList.remove('listening');listen.disabled=false;stop.disabled=true;status.textContent=e.error==='not-allowed'?'⚠️ Permite el acceso al micrófono.':'Error de voz: '+e.error};recognition.onend=()=>{face.classList.remove('listening');stop.disabled=true;if(!speaking&&!status.textContent.startsWith('⚠️')&&!status.textContent.includes('Pensando')){listen.disabled=false;status.textContent='Pulsa «Escuchar» para hablar de nuevo.'}};listen.onclick=()=>{try{recognition.start()}catch(e){}};stop.onclick=()=>recognition.stop()}
</script></body></html>
