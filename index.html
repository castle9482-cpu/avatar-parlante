<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genio Parlante</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle,#55307d,#10091b);color:white;font-family:system-ui;text-align:center;padding:18px;box-sizing:border-box}.app{max-width:580px;margin:auto}.face{width:290px;height:290px;margin:20px auto;border-radius:50%;background:linear-gradient(145deg,#ffc982,#b85d32);border:8px solid #e8ad4f;position:relative;box-shadow:0 0 45px #e8ad4f66}.face.listening{box-shadow:0 0 80px #62e6ff}.face.speaking .mouth{height:52px;border:7px solid #381b21;border-radius:50%}.eyes{position:absolute;top:90px;left:54px;right:54px;display:flex;justify-content:space-between}.eye{width:48px;height:62px;background:white;border-radius:50%;position:relative}.pupil{width:19px;height:27px;background:#17101f;border-radius:50%;position:absolute;left:15px;top:19px}.mouth{position:absolute;left:86px;top:169px;width:110px;height:34px;border-bottom:8px solid #381b21;border-radius:0 0 65px 65px}.brow{position:absolute;top:70px;width:60px;border-top:6px solid #673521;border-radius:50%}.b1{left:48px;transform:rotate(-8deg)}.b2{right:48px;transform:rotate(8deg)}button{border:0;border-radius:999px;padding:13px 20px;margin:5px;font-weight:800;cursor:pointer;background:#e8ad4f;color:#211424}.secondary{background:#ffffff20;color:white}.text{min-height:55px;padding:14px;background:#ffffff12;border-radius:16px}.settings{margin:18px auto;text-align:left;background:#ffffff0d;padding:14px;border-radius:16px}.settings input{width:100%;box-sizing:border-box;padding:11px;margin-top:10px;background:#120d1c;color:white;border:1px solid #ffffff30;border-radius:10px}.small{font-size:12px;opacity:.6;margin-top:10px}.status{min-height:28px;font-weight:bold}</style></head><body><main class="app"><h1>✨ Genio Parlante</h1><div>Habla conmigo por voz</div><div id="face" class="face"><div class="brow b1"></div><div class="brow b2"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div><div id="status" class="status">Pulsa «Escuchar» y habla.</div><div id="text" class="text">Estoy preparado para conversar.</div><button id="listen">🎙️ Escuchar</button><button id="stop" class="secondary" disabled>⏹ Parar</button><details class="settings"><summary>⚙️ Configurar IA gratuita</summary><input id="apiKey" type="password" placeholder="Pega aquí tu clave API de Groq"><button id="saveKey">Guardar clave</button><button id="clearKey" class="secondary">Borrar clave</button><div class="small">Usamos Groq. Su plan Free tiene límites de uso, pero no necesitas pagar para esta prueba. La clave se guarda solo en este navegador.</div></details></main><script>const face=document.getElementById('face'),status=document.getElementById('status'),text=document.getElementById('text'),listen=document.getElementById('listen'),stop=document.getElementById('stop'),apiKey=document.getElementById('apiKey'),saveKey=document.getElementById('saveKey'),clearKey=document.getElementById('clearKey');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,history=[];apiKey.value=localStorage.getItem('genio_groq_key')||'';saveKey.onclick=()=>{let k=apiKey.value.trim();if(k){localStorage.setItem('genio_groq_key',k);status.textContent='✅ Clave de Groq guardada.'}else status.textContent='Escribe una clave.'};clearKey.onclick=()=>{localStorage.removeItem('genio_groq_key');apiKey.value='';status.textContent='Clave borrada.'};function speak(s){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.94;u.pitch=1.08;u.onstart=()=>face.classList.add('speaking');u.onend=()=>face.classList.remove('speaking');speechSynthesis.speak(u)}async function askAI(msg){let key=localStorage.getItem('genio_groq_key');if(!key){let a='Primero introduce tu clave gratuita de Groq en Configurar IA.';text.textContent=a;speak(a);return}status.textContent='🧠 Pensando…';history.push({role:'user',content:msg});try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'system',content:'Eres un genio parlante simpático, natural y divertido. Responde siempre en español de España, breve y conversacional porque tu respuesta se leerá en voz alta. Mantén el contexto.'},...history.slice(-10)],temperature:.7,max_tokens:300})});let d=await r.json();if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));let a=d.choices?.[0]?.message?.content;if(!a)throw new Error('La IA no devolvió texto');history.push({role:'assistant',content:a});text.textContent=a;speak(a);status.textContent='Pulsa «Escuchar» para seguir.'}catch(e){history.pop();text.textContent='No he podido conectar con la IA: '+e.message;status.textContent='⚠️ Error de IA'}}if(!SR){status.textContent='Tu navegador no permite reconocimiento de voz.';listen.disabled=true}else{rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.onstart=()=>{face.classList.add('listening');status.textContent='🎙️ Te escucho…';listen.disabled=true;stop.disabled=false};rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)s+=e.results[i][0].transcript;else text.textContent='Escuchando: '+e.results[i][0].transcript}if(s)askAI(s.trim())};rec.onerror=e=>{face.classList.remove('listening');status.textContent='⚠️ '+e.error;listen.disabled=false;stop.disabled=true};rec.onend=()=>{face.classList.remove('listening');listen.disabled=false;stop.disabled=true};listen.onclick=()=>{try{rec.start()}catch(e){}};stop.onclick=()=>rec.stop()}</script></body></html>
