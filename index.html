<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genio Parlante</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle,#55307d,#10091b);color:white;font-family:system-ui;text-align:center;padding:18px;box-sizing:border-box}.app{max-width:580px;margin:auto}.face{width:290px;height:290px;margin:20px auto;border-radius:50%;background:linear-gradient(145deg,#ffc982,#b85d32);border:8px solid #e8ad4f;position:relative;box-shadow:0 0 45px #e8ad4f66}.face.listening{box-shadow:0 0 80px #62e6ff}.face.speaking .mouth{height:52px;border:7px solid #381b21;border-radius:50%}.eyes{position:absolute;top:90px;left:54px;right:54px;display:flex;justify-content:space-between}.eye{width:48px;height:62px;background:white;border-radius:50%;position:relative}.pupil{width:19px;height:27px;background:#17101f;border-radius:50%;position:absolute;left:15px;top:19px}.mouth{position:absolute;left:86px;top:169px;width:110px;height:34px;border-bottom:8px solid #381b21;border-radius:0 0 65px 65px}.brow{position:absolute;top:70px;width:60px;border-top:6px solid #673521;border-radius:50%}.b1{left:48px;transform:rotate(-8deg)}.b2{right:48px;transform:rotate(8deg)}button{border:0;border-radius:999px;padding:13px 20px;margin:5px;font-weight:800;cursor:pointer;background:#e8ad4f;color:#211424}.secondary{background:#ffffff20;color:white}.text{min-height:55px;padding:14px;background:#ffffff12;border-radius:16px}.settings{margin:18px auto;text-align:left;background:#ffffff0d;padding:14px;border-radius:16px}.settings input{width:100%;box-sizing:border-box;padding:11px;margin-top:10px;background:#120d1c;color:white;border:1px solid #ffffff30;border-radius:10px}.small{font-size:12px;opacity:.65;margin-top:10px}.status{min-height:28px;font-weight:bold}</style></head><body><main class="app"><h1>✨ Genio Parlante</h1><div>Habla conmigo por voz</div><div id="face" class="face"><div class="brow b1"></div><div class="brow b2"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div><div id="status" class="status">Pulsa «Escuchar» y habla.</div><div id="text" class="text">Estoy preparado para conversar.</div><button id="listen">🎙️ Escuchar</button><button id="stop" class="secondary" disabled>⏹ Parar</button><details class="settings"><summary>⚙️ Configurar IA gratuita</summary><input id="apiKey" type="password" placeholder="Pega aquí tu clave API de Google Gemini"><button id="saveKey">Guardar clave</button><button id="clearKey" class="secondary">Borrar clave</button><div class="small">La clave se guarda solamente en este navegador. No la compartas.</div></details></main><script>const face=document.getElementById('face'),status=document.getElementById('status'),text=document.getElementById('text'),listen=document.getElementById('listen'),stop=document.getElementById('stop'),apiKey=document.getElementById('apiKey'),saveKey=document.getElementById('saveKey'),clearKey=document.getElementById('clearKey');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,previousInteractionId=null;function cleanKey(k){return k.normalize('NFKC').replace(/[\u0000-\u001F\u007F-\u009F]/g,'').replace(/[^\x00-\x7F]/g,'').trim()}apiKey.value=localStorage.getItem('genio_gemini_key')||'';saveKey.onclick=()=>{const k=cleanKey(apiKey.value);if(k){apiKey.value=k;localStorage.setItem('genio_gemini_key',k);status.textContent='✅ Clave guardada.'}};clearKey.onclick=()=>{localStorage.removeItem('genio_gemini_key');apiKey.value='';previousInteractionId=null;status.textContent='Clave borrada.'};function speak(s){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.94;u.pitch=1.08;u.onstart=()=>face.classList.add('speaking');u.onend=()=>face.classList.remove('speaking');speechSynthesis.speak(u)}async function askAI(msg){const key=cleanKey(localStorage.getItem('genio_gemini_key')||'');if(!key){const a='Primero introduce tu clave de Google Gemini en Configurar IA gratuita.';text.textContent=a;speak(a);return}status.textContent='🧠 Pensando…';try{const body={model:'gemini-3.5-flash-lite',input:msg,system_instruction:'Eres un genio parlante simpático y natural. Responde en español de España, breve y conversacional porque se leerá en voz alta. Mantén el contexto de la conversación usando la interacción anterior.'};if(previousInteractionId)body.previous_interaction_id=previousInteractionId;const r=await fetch('https://generativelanguage.googleapis.com/v1/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));previousInteractionId=d.id||previousInteractionId;let a=d.output_text||'';if(!a&&Array.isArray(d.outputs))for(const o of d.outputs){for(const c of (o.content||[]))if(c.text)a+=c.text}if(!a&&Array.isArray(d.steps))for(const s of d.steps){for(const c of (s.content||[]))if(c.text)a+=c.text}a=a.trim();if(!a)throw new Error('La IA no devolvió texto');text.textContent=a;speak(a);status.textContent='Pulsa «Escuchar» para seguir.'}catch(e){text.textContent='No he podido conectar con la IA: '+e.message;status.textContent='⚠️ Error de IA'}}if(!SR){status.textContent='Tu navegador no permite reconocimiento de voz.';listen.disabled=true}else{rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.onstart=()=>{face.classList.add('listening');status.textContent='🎙️ Te escucho…';listen.disabled=true;stop.disabled=false};rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)s+=e.results[i][0].transcript;else text.textContent='Escuchando: '+e.results[i][0].transcript}if(s)askAI(s.trim())};rec.onerror=e=>{face.classList.remove('listening');status.textContent='⚠️ '+e.error;listen.disabled=false;stop.disabled=true};rec.onend=()=>{face.classList.remove('listening');listen.disabled=false;stop.disabled=true};listen.onclick=()=>{try{rec.start()}catch(e){}};stop.onclick=()=>rec.stop()}</script></body></html>
